name: curate (monthly)
# Re-curate the endpoints the weekly purchase buys, from the latest x402 Endpoint tables, the CDP
# Bazaar and x402scan (npm run curate → targets/curated.json). No payment is made here.
on:
  schedule:
    - cron: "23 2 1 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe-data
  cancel-in-progress: false
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Curate
        run: npm run curate
      # Names, 1P/3P and logos of the curated operators (same source as x402jp.com's x402 Endpoint
      # section; else the operator's own icon). Committed, so the page never loads a logo from elsewhere.
      - name: Operator logos
        run: npm run logos
      - name: Commit
        run: |
          git config user.name "seller-probe[bot]"
          git config user.email "seller-probe@users.noreply.github.com"
          git add targets/curated.json targets/operators.json web/public/logos
          git diff --cached --quiet && exit 0
          git commit -m "curate $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
