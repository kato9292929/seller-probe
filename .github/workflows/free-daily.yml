name: free-probe (daily)
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe-data
  cancel-in-progress: false
jobs:
  free:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # commits go to main even before the default branch is switched
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Select targets
        run: npm run targets
      - name: Free probe
        run: npm run probe:free
        env:
          PROBE_CONCURRENCY: "16"
      - name: RFQ reference snapshot
        if: ${{ vars.RFQ_INDEXER_URL != '' }}
        run: npm run rfq:snapshot
        env:
          RFQ_INDEXER_URL: ${{ vars.RFQ_INDEXER_URL }}
      - name: Check scores build
        run: npm run score
      - name: Commit
        run: |
          git config user.name "seller-probe[bot]"
          git config user.email "seller-probe@users.noreply.github.com"
          git add log targets data
          git diff --cached --quiet && exit 0
          git commit -m "free probe $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
